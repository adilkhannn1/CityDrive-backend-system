<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Заявки от компании')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <h1>Заявки от компании</h1>
    <p style="color:#64748b">Контроллер принял отметку — одобрите начало работы или отклоните назначение.</p>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Адрес</th>
            <th>Компания / контролёр</th>
            <th>Комментарий</th>
            <th>Принято</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${marks}">
            <td th:text="${m.id}">1</td>
            <td><a th:href="@{/admin/marks/{id}(id=${m.id})}" th:text="${m.title}">title</a></td>
            <td th:text="${m.address}">addr</td>
            <td th:text="${controllerLabels[m.assignedControllerId]} ?: '—'">company</td>
            <td th:text="${m.controllerComment} ?: '—'">comment</td>
            <td th:text="${m.acceptedAt != null ? #temporals.format(m.acceptedAt, 'dd.MM.yyyy HH:mm') : '—'}">date</td>
            <td>
                <form th:action="@{/admin/mark-applications/{id}/approve(id=${m.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn primary">Начать работу</button>
                </form>
                <form th:action="@{/admin/mark-applications/{id}/reject(id=${m.id})}" method="post" style="display:inline;margin-left:4px">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn" onclick="return confirm('Снять контроллера и вернуть отметку в «Новые»?')">Отклонить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(marks)}">
            <td colspan="7" class="empty">Нет заявок от контроллеров</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
