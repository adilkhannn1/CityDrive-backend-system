<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новости')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h1>Новости</h1>
        <a th:href="@{/admin/news/new}" class="btn btn-primary">+ Добавить</a>
    </div>
    <p th:if="${message}" class="alert success" th:text="${message}"></p>
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Заголовок</th>
            <th>Описание</th>
            <th>Дата публикации</th>
            <th>Опубликована</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="n : ${newsList}">
            <td th:text="${n.id}">1</td>
            <td th:text="${n.title}">title</td>
            <td th:text="${#strings.abbreviate(n.description, 60)}">desc</td>
            <td th:text="${n.publishedAt}">date</td>
            <td th:text="${n.published} ? 'Да' : 'Нет'">Да</td>
            <td class="actions-cell">
                <a th:href="@{/admin/news/{id}/edit(id=${n.id})}" class="btn small">Редактировать</a>
                <form th:action="@{/admin/news/{id}/delete(id=${n.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Удалить эту новость?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn danger small">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(newsList)}">
            <td colspan="6" style="text-align:center;color:#888">Новостей пока нет</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
