<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Пользователи')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <h1>Пользователи</h1>
    <p th:if="${message}" class="alert success" th:text="${message}"></p>
    <p th:if="${error}" class="alert error" th:text="${error}"></p>
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Роль</th>
            <th>Подтверждён</th>
            <th>Заблокирован</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.fullName}">name</td>
            <td th:text="${u.phone}">phone</td>
            <td><span class="badge" th:text="${u.role}">ADMIN</span></td>
            <td>
                <span th:if="${u.approved}" class="badge ok">Да</span>
                <span th:unless="${u.approved}" class="badge warn">Нет</span>
            </td>
            <td th:text="${u.blocked} ? 'Да' : 'Нет'">Нет</td>
            <td class="actions-cell">
                <form th:if="${!u.approved}" th:action="@{/admin/users/{id}/approve(id=${u.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="approved" value="true"/>
                    <button type="submit" class="btn primary small">Подтвердить</button>
                </form>
                <form th:if="${u.approved and u.role.name() != 'ADMIN'}" th:action="@{/admin/users/{id}/approve(id=${u.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="approved" value="false"/>
                    <button type="submit" class="btn small">Снять</button>
                </form>
                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Удалить этого пользователя?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn danger small">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
