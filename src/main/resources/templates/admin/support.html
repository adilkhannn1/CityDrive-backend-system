<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Служба поддержки')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <h1>Служба поддержки</h1>
    <p style="color:#64748b;margin-top:-.5rem">
        Эти данные отдаются в приложение через <code>GET /api/info</code> и <code>GET /api/support</code>
    </p>
    <p th:if="${message}" class="alert success" th:text="${message}"></p>

    <form th:action="@{/admin/support}" method="post" style="max-width:700px">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div style="margin-bottom:1rem">
            <label>WhatsApp номер *</label><br/>
            <input type="text" name="whatsappPhone" th:value="${support.whatsappPhone}" required
                   placeholder="77001234567"
                   style="width:100%;padding:.5rem;box-sizing:border-box"/>
            <small style="color:#888">Только цифры, без +. Flutter откроет https://wa.me/77001234567</small>
        </div>

        <div style="margin-bottom:1rem">
            <label>Текст сообщения WhatsApp *</label><br/>
            <textarea name="whatsappMessage" rows="3" required
                      style="width:100%;padding:.5rem;box-sizing:border-box"
                      th:text="${support.whatsappMessage}"></textarea>
        </div>

        <div style="margin-bottom:1rem">
            <label>Email *</label><br/>
            <input type="email" name="email" th:value="${support.email}" required
                   placeholder="support@citydrive.kz"
                   style="width:100%;padding:.5rem;box-sizing:border-box"/>
        </div>

        <div style="margin-bottom:1.5rem">
            <label>Телефон поддержки *</label><br/>
            <input type="text" name="phone" th:value="${support.phone}" required
                   placeholder="+77001234567"
                   style="width:100%;padding:.5rem;box-sizing:border-box"/>
        </div>

        <button type="submit" class="btn primary">Сохранить</button>
    </form>

    <section class="card" style="margin-top:2rem">
        <h2 style="margin-top:0">Предпросмотр API</h2>
        <dl>
            <dt>whatsapp_phone</dt>
            <dd th:text="${support.whatsappPhone}">77001234567</dd>
            <dt>whatsapp_message</dt>
            <dd th:text="${support.whatsappMessage}">...</dd>
            <dt>email</dt>
            <dd th:text="${support.email}">...</dd>
            <dt>phone</dt>
            <dd th:text="${support.phone}">...</dd>
        </dl>
    </section>
</main>
</body>
</html>
