<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Города')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div>
            <h1 style="margin-bottom:.25rem">Города</h1>
            <p style="margin:0;color:#64748b;font-size:.95rem">
                Список отдаётся в приложение через <code>GET /api/cities</code> (только активные)
            </p>
        </div>
        <a th:href="@{/admin/cities/new}" class="btn primary">+ Добавить</a>
    </div>
    <p th:if="${message}" class="alert success" th:text="${message}"></p>
    <p th:if="${error}" class="alert" style="background:#fee2e2;color:#991b1b" th:text="${error}"></p>
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Порядок</th>
            <th>Активен</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cities}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.name}">Алматы</td>
            <td th:text="${c.sortOrder}">1</td>
            <td>
                <span th:if="${c.active}" class="badge ok">Да</span>
                <span th:unless="${c.active}" class="badge warn">Нет</span>
            </td>
            <td class="actions-cell">
                <a th:href="@{/admin/cities/{id}/edit(id=${c.id})}" class="btn small">Редактировать</a>
                <form th:action="@{/admin/cities/{id}/delete(id=${c.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Удалить этот город?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn danger small">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cities)}">
            <td colspan="5" style="text-align:center;color:#888">Городов пока нет</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
