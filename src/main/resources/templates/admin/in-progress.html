<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('В работе')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <h1>В работе</h1>
    <p style="color:#64748b">Отметки, по которым админ одобрил начало работы (in_progress).</p>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Адрес</th>
            <th>Компания / контролёр</th>
            <th>Начало работ</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${marks}">
            <td th:text="${m.id}">1</td>
            <td><a th:href="@{/admin/marks/{id}(id=${m.id})}" th:text="${m.title}">title</a></td>
            <td th:text="${m.address}">addr</td>
            <td th:text="${controllerLabels[m.assignedControllerId]} ?: '—'">company</td>
            <td th:text="${m.workStartedAt != null ? #strings.replace(#strings.substring(m.workStartedAt.toString(), 0, 16), 'T', ' ') : '—'}">date</td>
            <td>
                <a th:href="@{/admin/marks/{id}(id=${m.id})}">Открыть</a>
                <form th:action="@{/admin/marks/{id}/status(id=${m.id})}" method="post" style="display:inline;margin-left:4px">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="status" value="fixed"/>
                    <input type="hidden" name="assignedControllerId" th:value="${m.assignedControllerId}"/>
                    <button type="submit" class="btn">→ fixed</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(marks)}">
            <td colspan="6" class="empty">Нет отметок в работе</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
