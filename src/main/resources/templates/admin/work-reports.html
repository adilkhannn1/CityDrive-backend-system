<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Отчёты контроллеров')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <h1>Отчёты контроллеров</h1>
    <p style="color:#64748b">Контроллер отправил отчёт о выполненной работе — проверьте фото «после» и примите или верните на доработку.</p>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Адрес</th>
            <th>Контролёр</th>
            <th>Описание отчёта</th>
            <th>Отправлен</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${marks}">
            <td th:text="${m.id}">1</td>
            <td><a th:href="@{/admin/marks/{id}(id=${m.id})}" th:text="${m.title}">title</a></td>
            <td th:text="${m.address}">addr</td>
            <td th:text="${controllerLabels[m.assignedControllerId]} ?: '—'">company</td>
            <td th:text="${m.workReportDescription} ?: '—'">desc</td>
            <td th:text="${m.workReportSubmittedAt != null ? #strings.replace(#strings.substring(m.workReportSubmittedAt.toString(), 0, 16), 'T', ' ') : '—'}">date</td>
            <td>
                <a th:href="@{/admin/marks/{id}(id=${m.id})}">Открыть</a>
                <form th:action="@{/admin/work-reports/{id}/approve(id=${m.id})}" method="post" style="display:inline;margin-left:4px">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn primary">Принять → fixed</button>
                </form>
                <form th:action="@{/admin/work-reports/{id}/reject(id=${m.id})}" method="post" style="display:inline;margin-left:4px">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn" onclick="return confirm('Вернуть контроллеру на доработку?')">Отклонить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(marks)}">
            <td colspan="7" class="empty">Нет отчётов на проверке</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
