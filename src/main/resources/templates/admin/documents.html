<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Документы')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div>
            <h1 style="margin-bottom:.25rem">Документы профиля</h1>
            <p style="margin:0;color:#64748b;font-size:.95rem">
                Ссылки отображаются в мобильном приложении: Профиль → Документы
            </p>
        </div>
        <a th:href="@{/admin/documents/new}" class="btn primary">+ Добавить</a>
    </div>
    <p th:if="${message}" class="alert success" th:text="${message}"></p>
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Заголовок (RU)</th>
            <th>URL</th>
            <th>Порядок</th>
            <th>Активен</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${documents}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.titleRu}">title</td>
            <td style="max-width:320px;word-break:break-all">
                <a th:href="${d.contentRu}" th:text="${d.contentRu}" target="_blank">url</a>
            </td>
            <td th:text="${d.sortOrder}">1</td>
            <td>
                <span th:if="${d.active}" class="badge ok">Да</span>
                <span th:unless="${d.active}" class="badge warn">Нет</span>
            </td>
            <td class="actions-cell">
                <a th:href="@{/admin/documents/{id}/edit(id=${d.id})}" class="btn small">Редактировать</a>
                <form th:action="@{/admin/documents/{id}/delete(id=${d.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Удалить этот документ?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn danger small">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(documents)}">
            <td colspan="6" style="text-align:center;color:#888">Документов пока нет</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
