<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новость')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <h1 th:text="${isNew} ? 'Добавить новость' : 'Редактировать новость'">Новость</h1>
    <form th:action="${isNew} ? @{/admin/news/new} : @{/admin/news/{id}/edit(id=${newsId})}"
          method="post" style="max-width:700px">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div style="margin-bottom:1rem">
            <label>Заголовок *</label><br/>
            <input type="text" name="title" th:value="${news.title}" required
                   style="width:100%;padding:.5rem;box-sizing:border-box"/>
        </div>

        <div style="margin-bottom:1rem">
            <label>Краткое описание *</label><br/>
            <textarea name="description" rows="3" required
                      style="width:100%;padding:.5rem;box-sizing:border-box"
                      th:text="${news.description}"></textarea>
        </div>

        <div style="margin-bottom:1rem">
            <label>Полный текст (опционально)</label><br/>
            <textarea name="content" rows="6"
                      style="width:100%;padding:.5rem;box-sizing:border-box"
                      th:text="${news.content}"></textarea>
        </div>

        <div style="margin-bottom:1rem">
            <label>URL картинки (опционально)</label><br/>
            <input type="text" name="imageUrl" th:value="${news.imageUrl}"
                   placeholder="https://example.com/image.jpg"
                   style="width:100%;padding:.5rem;box-sizing:border-box"/>
        </div>

        <div style="margin-bottom:1rem">
            <label>Дата публикации (ISO-8601, напр. <code>2026-05-29T10:00:00Z</code>)</label><br/>
            <input type="text" name="publishedAt" th:value="${news.publishedAt}"
                   placeholder="2026-05-29T10:00:00Z"
                   style="width:100%;padding:.5rem;box-sizing:border-box"/>
            <small style="color:#888">Оставьте пустым — будет установлено текущее время</small>
        </div>

        <div style="margin-bottom:1.5rem">
            <label>
                <input type="checkbox" name="published" value="true" th:checked="${news.published}"/>
                Опубликована (видна в мобильном приложении)
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        &nbsp;
        <a th:href="@{/admin/news}">Отмена</a>
    </form>
</main>
</body>
</html>
