server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: city-drive-admin
  datasource:
    url: jdbc:h2:file:./data/citydrive;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: citydrive-admin-jwt-secret-key-change-in-production-32chars
    expiration-ms: 86400000
  uploads:
    dir: uploads
  support:
    whatsapp-phone: "77001234567"
    whatsapp-message: "Здравствуйте! Нужна помощь по City Drive"
    email: "support@citydrive.kz"
    phone: "+77001234567"

logging:
  level:
    org.springframework.security: INFO
